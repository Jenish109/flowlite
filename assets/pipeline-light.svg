<text x="30" y="324" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#5b6574">Typical after warm-up: transcribe ≈ 0.3–0.8 s · cleanup ≈ 0.5–1.5 s · only the cleanup step leaves your Mac</text>
